name: coderabbit-trigger-test

# Temporary, for btclib-org/.github#1998: does a trigger comment posted by
# a workflow, as github-actions[bot], start CodeRabbit on a repository
# under ten stars? Labelling the pull request `question` posts it.

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  trigger:
    if: github.event.label.name == 'question'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # the trigger comment
    steps:
      - name: Post the trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr comment "$PR" -R "$REPO" --body '@coderabbitai full review'
